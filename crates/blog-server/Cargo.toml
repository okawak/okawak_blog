[package]
publish = false
name = "blog-server"
version.workspace = true
authors.workspace = true
description.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono = { workspace = true, features = ["serde"] }
blog-domain = { path = "../blog-domain" }
blog-infra = { path = "../blog-infra" }
httpdate.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
topcoat = { workspace = true, features = ["asset", "discover", "icon", "metadata", "l10n-number", "l10n-datetime", "router", "runtime", "serve", "tailwind", "tower", "ui"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[build-dependencies]
topcoat = { workspace = true, features = ["tailwind"] }

[dev-dependencies]
tempfile.workspace = true
