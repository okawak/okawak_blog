[package]
publish = false
name = "blog-server"
version.workspace = true
authors.workspace = true
description.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes.workspace = true
anyhow.workspace = true
async-trait.workspace = true
blog-domain = { path = "../blog-domain", features = ["schema"] }
blog-infra = { path = "../blog-infra" }
headers.workspace = true
httpdate.workspace = true
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo", "tzdb-concatenated"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
topcoat = { workspace = true, features = ["asset", "cookie", "discover", "icon", "metadata", "openapi", "l10n-number", "l10n-datetime", "router", "runtime", "serve", "tailwind", "ui"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[build-dependencies]
toml.workspace = true
topcoat = { workspace = true, features = ["tailwind"] }

[dev-dependencies]
tempfile.workspace = true
