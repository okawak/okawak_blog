name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MISE_LOCKED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Update Rust stable toolchain
        run: |
          rustup update stable --no-self-update
          rustup show

      - name: Set up shared build tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5

      - name: Check tool version consistency
        run: mise run versions-check

      - name: Check Rust and Topcoat formatting
        run: mise run format-check

      - name: Validate service scripts
        run: mise run test-service

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Share dependencies with browser-e2e; v2.9.3 omits the virtual workspace root manifest.
          shared-key: rust-ci-${{ hashFiles('Cargo.toml') }}
          cache-bin: "false"

      - name: Validate public artifact gate
        run: mise run test-public-artifacts

      - name: Test workspace
        run: cargo test --workspace

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  browser-e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Update Rust stable toolchain
        run: |
          rustup update stable --no-self-update
          rustup show

      - name: Set up shared build tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-ci-${{ hashFiles('Cargo.toml') }}
          cache-bin: "false"
          # verify owns the shared cache; this dependent job only restores it.
          save-if: "false"

      - name: Run fixture browser E2E
        env:
          PLAYWRIGHT_INSTALL_WITH_DEPS: "true"
        run: mise run test-e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-fixture-traces
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
