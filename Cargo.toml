[workspace]
members = [
    "crates/domain",
    "crates/publish",
    "crates/site/*",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["okawak"]
description = "okawak's blog builder"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["credentials-process"] }
aws-sdk-s3 = { version = "1", default-features = false }
chrono = "0.4"
futures = "0.3"
html-escape = "0.2"
httpdate = "1"
ignore = "0.4"
indoc = "2"
pulldown-cmark = "0.13"
regex = "1"
reqwest = "0.13"
rstest = "0.26"
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = "1"
topcoat = { version = "=0.6.2", default-features = false, features = ["asset", "router", "runtime", "serve", "tailwind", "tower"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
