[workspace]
members = [
    "crates/domain",
    "crates/export",
    "crates/publish",
    "crates/infra",
    "crates/server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["okawak"]
description = "okawak's blog builder"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
aws-config = { version = "1", default-features = false }
aws-sdk-s3 = { version = "1", default-features = false }
chrono = "0.4"
clap = "4"
futures = "0.3"
html-escape = "0.2"
httpdate = "1"
indoc = "2"
pulldown-cmark = "0.13"
percent-encoding = "2"
regex = "1"
reqwest = "0.13"
rstest = "0.27"
scraper = "0.27"
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = "1"
topcoat = { version = "=0.9.0", default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
walkdir = "2"
