[tools]
bun = "1.4.0"
"cargo:topcoat-cli" = "0.7.0"

[env]
PROJECT_NAME = "okawak_blog"
SERVICE_NAME = "okawak_blog"
SERVICE_FILE = "service/okawak_blog.service"
BIN_DIR = "./bin"
TARGET_BIN = "./target/release/server"
TARGET_ASSET_DIR = "./target/release/assets"
DEPLOY_STAGED_ASSETS = "./target/assets-staged"
TOPCOAT_TAILWIND_VERSION = "4.3.3"

[tasks.check-deps]
description = "Check if the production Topcoat build tools are installed"
run = '''
set -e
echo "Checking dependencies..."
mise --version
cargo --version
topcoat fmt --version
expected_topcoat_version="$(sed -nE 's/^"cargo:topcoat-cli" = "([^"]+)"$/\1/p' mise.toml)"
actual_topcoat_version="$(topcoat fmt --version | awk '{print $2}')"
[ "$actual_topcoat_version" = "$expected_topcoat_version" ]
'''

[tasks.versions-check]
description = "Check shared tool and build helper version consistency"
run = "bash scripts/check_tool_versions.sh"

[tasks.e2e-install]
description = "Install root E2E dependencies with bun"
run = '''
cd e2e
bun install --frozen-lockfile
'''

[tasks.e2e-update]
description = "Update root E2E dependencies with bun"
run = '''
cd e2e
bun update
'''

[tasks.e2e-outdated]
description = "Show outdated root E2E dependencies with bun"
run = '''
cd e2e
bun outdated
'''

[tasks.e2e-install-browser]
description = "Install the Chromium browser used by Playwright E2E"
depends = ["e2e-install"]
run = '''
cd e2e
if [ "${PLAYWRIGHT_INSTALL_WITH_DEPS:-false}" = "true" ]; then
  bunx playwright install --with-deps chromium
else
  bunx playwright install chromium
fi
'''

[tasks.sync-obsidian]
description = "Initialize and checkout the latest private Obsidian submodule revision"
run = '''
obsidian_path="crates/publish/obsidian"
if [ ! -e "$obsidian_path/.git" ]; then
  git submodule update --init --recursive "$obsidian_path"
fi
if [ -n "$(git -C "$obsidian_path" status --porcelain)" ]; then
  echo "sync-obsidian: submodule has uncommitted changes; commit or stash them first" >&2
  exit 1
fi
git submodule update --remote --checkout --recursive "$obsidian_path"
'''

[tasks.format]
description = "Format Rust and Topcoat source files"
run = '''
cargo fmt --all
find crates/site/server -name '*.rs' -exec topcoat fmt {} +
'''

[tasks.dev]
description = "Run the local Topcoat development server with S3 artifacts"
env = { OKAWAK_BLOG_ARTIFACT_SOURCE = "s3", OKAWAK_BLOG_SITE_ORIGIN = "http://127.0.0.1:8008", OKAWAK_BLOG_ADDR = "127.0.0.1:8008" }
run = '''
: "${OKAWAK_BLOG_ARTIFACT_BUCKET:?OKAWAK_BLOG_ARTIFACT_BUCKET is required}"
topcoat asset bundle --package server --bin server
./target/debug/server
'''

[tasks.dev-local]
description = "Publish the local Obsidian source and serve its generated artifacts"
env = { OKAWAK_BLOG_ARTIFACT_SOURCE = "local", OKAWAK_BLOG_ARTIFACT_LOCAL_ROOT = "crates/publish/dist/site", OKAWAK_BLOG_SITE_ORIGIN = "http://127.0.0.1:8008", OKAWAK_BLOG_ADDR = "127.0.0.1:8008" }
run = '''
mise run sync-obsidian
cargo run -p publish
topcoat asset bundle --package server --bin server
./target/debug/server
'''

[tasks.dev-fixture]
description = "Run the Topcoat runtime with fixture artifacts"
env = { OKAWAK_BLOG_ARTIFACT_SOURCE = "local", OKAWAK_BLOG_ARTIFACT_LOCAL_ROOT = "e2e/fixtures/site", OKAWAK_BLOG_ADDR = "127.0.0.1:8009" }
run = '''
topcoat asset bundle --package server --bin server --release
# Asset IDs are tied to the exact binary scanned by the bundler.
./target/release/server
'''

[tasks.clean-project]
description = "Clean the Cargo build artifacts"
run = "cargo clean"

[tasks.build-project]
description = "Build the integrated Topcoat binary and asset bundle for deployment"
depends = ["check-deps"]
run = "topcoat asset bundle --package server --bin server --release"

[tasks.build-deployment]
description = "Build a production release outside the live site directory"
depends = ["check-deps"]
run = "topcoat asset bundle --package server --bin server --release --out \"$DEPLOY_STAGED_ASSETS\""

[tasks.build-server]
description = "Build the Topcoat server binary only"
depends = ["check-deps"]
run = "cargo build --release -p server --bin server"

[tasks.pull]
description = "Pull the latest changes from origin/main"
run = "git pull --ff-only origin main"

[tasks.pull-with-submodules]
description = "Pull the latest changes from origin/main and update submodules"
depends = ["pull"]
run = "git submodule update --init --recursive"

[tasks.stop]
description = "Stop the systemd service"
run = '''
if sudo systemctl cat "$SERVICE_NAME.service" >/dev/null 2>&1; then
  sudo systemctl stop "$SERVICE_NAME.service"
fi
'''

[tasks.service]
description = "Install the systemd unit file"
run = '''
sudo cp -f "$SERVICE_FILE" "/etc/systemd/system/$SERVICE_NAME.service"
'''

[tasks.bin]
description = "Copy the existing Topcoat server binary and asset bundle into ./bin"
run = '''
sudo mkdir -p "$BIN_DIR"
sudo install -m 0755 "$TARGET_BIN" "$BIN_DIR/$SERVICE_NAME"
sudo rm -rf -- "$BIN_DIR/assets"
sudo cp -R "$TARGET_ASSET_DIR" "$BIN_DIR/assets"
sudo chown -R root:root "$BIN_DIR"
'''

[tasks.deploy]
description = "Reload systemd and start the service"
run = '''
sudo systemctl daemon-reload
sudo systemctl start "$SERVICE_NAME"
'''

[tasks.status]
description = "Check the systemd service status"
run = "sudo systemctl status $SERVICE_NAME"

[tasks.logs]
description = "Tail the systemd service logs"
run = "sudo journalctl -u $SERVICE_NAME -f"

[tasks.logs-recent]
description = "Show recent systemd service logs"
run = "sudo journalctl -u $SERVICE_NAME --lines=50"

[tasks.restart]
description = "Restart the systemd service"
run = "sudo systemctl restart $SERVICE_NAME"

[tasks.production-deploy]
description = "Pull, build, and deploy the production application service in order"
run = '''
set -euo pipefail
mise run pull
mise run quick-deploy
echo "production-deploy completed"
'''

[tasks.quick-deploy]
description = "Build a staged release and activate it with rollback protection"
run = '''
set -euo pipefail
mise run build-deployment
bash scripts/activate_staged_deployment.sh
echo "quick-deploy completed"
'''

[tasks.rotate-runtime-certificate]
description = "Rotate the production IAM Roles Anywhere client certificate from the registered management host"
run = "bash scripts/rotate_runtime_certificate.sh"

[tasks.ci-flow]
description = "Run the CI-oriented local flow"
depends = ["check-deps", "format", "build-project"]
run = "echo 'ci-flow completed'"

[tasks.test]
description = "Run tests for all workspace crates"
run = "cargo test --workspace"

[tasks.test-service]
description = "Validate systemd units, deployment rollback, and certificate rotation"
run = '''
bash service/tests/systemd_units_test.sh
bash service/tests/staged_deployment_test.sh
bash service/tests/runtime_certificate_rotation_test.sh
'''

[tasks.test-domain]
description = "Run domain layer tests"
run = "cargo test -p domain"

[tasks.test-server]
description = "Run server tests"
run = "cargo test -p server"

[tasks.test-e2e]
description = "Run artifact-driven browser E2E with bun and Chromium"
depends = ["e2e-install-browser"]
run = '''
cd e2e
bun run test
'''

[tasks.test-e2e-s3]
description = "Run the local browser smoke test against S3 artifacts"
depends = ["e2e-install-browser"]
run = '''
: "${OKAWAK_BLOG_ARTIFACT_BUCKET:?OKAWAK_BLOG_ARTIFACT_BUCKET is required}"
cd e2e
bun run test:s3
'''

[tasks.test-release]
description = "Run tests in release mode"
run = "cargo test --workspace --release"

[tasks.clippy]
description = "Run clippy with warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.check]
description = "Run cargo check for the workspace"
run = "cargo check --workspace"

[tasks.check-domain]
description = "Run cargo check for the domain crate"
run = "cargo check -p domain"

[tasks.check-server]
description = "Run cargo check for the server crate"
run = "cargo check -p server"

[tasks.bloat]
description = "Analyze release binary size"
run = "cargo bloat --release --crates"

[tasks.help]
description = "Show the available local tasks"
run = '''
echo "Use 'mise tasks ls' to view all tasks."
echo ""
echo "Common commands:"
echo "  mise run dev"
echo "  mise run dev-local"
echo "  mise run build-project"
echo "  mise run e2e-install"
echo "  mise run e2e-update"
echo "  mise run e2e-outdated"
echo "  mise run e2e-install-browser"
echo "  mise run test"
echo "  mise run test-e2e"
echo "  mise run test-e2e-s3"
echo "  mise run clippy"
echo "  mise run check"
'''
